name: Laravel 13

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, gd, mbstring, pdo_sqlite, zip
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer test -- --fail-on-deprecation --fail-on-phpunit-deprecation
      - run: composer audit --locked --abandoned=report
      - run: composer phpstan

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dcat_test
          MYSQL_ROOT_PASSWORD: testing-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: fileinfo, gd, mbstring, pdo_mysql, zip
          tools: composer:v2
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer test
        env:
          DCAT_TEST_DB_DRIVER: mysql
          DCAT_TEST_DB_HOST: 127.0.0.1
          DCAT_TEST_DB_DATABASE: dcat_test
          DCAT_TEST_DB_USERNAME: root
          DCAT_TEST_DB_PASSWORD: testing-only

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: fileinfo, gd, mbstring, pdo_sqlite, zip
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: npm ci
      - run: npm audit
      - run: npm run production
      - run: npm run audit:assets
      - run: git diff --exit-code -- resources/assets resources/dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
